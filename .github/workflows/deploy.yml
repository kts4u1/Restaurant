# 매주 카카오 API 로 areas.json 지역의 식당·메뉴 가격을 모아 사이트(GitHub Pages)를 다시 만든다.
#
# 처음 한 번만 설정:
#   1) Settings → Secrets and variables → Actions → New repository secret
#      이름: KAKAO_REST_API_KEY / 값: 카카오 개발자 사이트의 REST API 키
#   2) Settings → Pages → Build and deployment → Source: GitHub Actions
#   3) areas.json 에 식당을 찾을 지역(집 근처, 회사 근처 …)을 넣는다
#   4) Actions → "식당 데이터 업데이트" → Run workflow
#
# 키는 시크릿에만 있고 사이트 파일에는 들어가지 않는다.
# 받다가 실패하면 배포하지 않으므로 지난번 사이트가 그대로 남는다.
name: 식당 데이터 업데이트

on:
  schedule:
    # 매주 월·목요일 04:00 (한국 시간) = 일·수요일 19:00 UTC
    - cron: '0 19 * * 0,3'
  workflow_dispatch:
  push:
    branches: [claude/wizardly-albattani-1kja6n]
    paths:
      - 'areas.json'
      - 'public/**'
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  # 공개 저장소의 예약 실행은 60일 동안 활동이 없으면 꺼지므로 매번 다시 켜 둔다
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      - name: 카카오 키 확인
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          if [ -z "$KAKAO_REST_API_KEY" ]; then
            echo "::error::KAKAO_REST_API_KEY 시크릿이 없습니다. Settings → Secrets and variables → Actions → New repository secret 에 넣어 주세요."
            exit 1
          fi

      - name: 식당·메뉴 가격 모으기
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: node scripts/build-static.js

      # Pages 를 아직 켜지 않았으면 배포만 건너뛴다
      - name: Pages 설정 확인
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages 가 GitHub Actions 배포로 설정되어 있지 않아 배포를 건너뜁니다. Settings → Pages → Source: GitHub Actions"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 예약 실행 켜 두기
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
