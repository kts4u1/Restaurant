# 앱(화면 + 검색 서버)을 Cloudflare Workers 에 배포한다.
# 카카오 키는 GitHub 시크릿 → Cloudflare 비밀값으로만 옮겨지고, 화면 파일에는 들어가지 않는다.
#
# 처음 한 번만 설정 (Settings → Secrets and variables → Actions → New repository secret):
#   KAKAO_REST_API_KEY     카카오 개발자 사이트의 REST API 키
#   CLOUDFLARE_API_TOKEN   Cloudflare → My Profile → API Tokens → Create Token → "Edit Cloudflare Workers" 템플릿
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare → Workers & Pages 화면 오른쪽의 Account ID
# 그다음 Actions → "앱 배포" → Run workflow. 주소는 실행 결과 요약에 나온다 (https://hankki.<내 이름>.workers.dev).
name: 앱 배포

on:
  workflow_dispatch:
  push:
    branches: [claude/wizardly-albattani-1kja6n]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      - name: 시크릿 확인
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in KAKAO_REST_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name 시크릿이 없습니다. Settings → Secrets and variables → Actions → New repository secret 에 넣어 주세요."
              missing=1
            fi
          done
          exit $missing

      - name: Cloudflare 에 배포
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          command: deploy
          secrets: |
            KAKAO_REST_API_KEY
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}

      - name: 주소 안내
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "휴대폰에서 이 주소를 열고 '홈 화면에 추가' 하세요: ${URL:-Cloudflare 대시보드 → Workers & Pages → hankki 에서 주소 확인}" >> "$GITHUB_STEP_SUMMARY"
          echo "주소: $URL"
